[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "debate-agent"
version = "0.1.0"
description = "LangGraph supervisor for Codex CLI and Claude Code CLI debates"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "langchain-deepseek>=1.1,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
ui = [
  "numpy>=1.23,<2.3",
  "streamlit>=1.42,<2",
]
dev = [
  "build>=1.3,<2",
  "jsonschema>=4.26,<5",
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
debate-agent = "debate_agent.cli:entrypoint"
discuss-agent = "debate_agent.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/debate_agent"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/schemas", "/tests", "/*.md", "/LICENSE", "/pyproject.toml", "/.gitignore"]
exclude = ["/.runtime", "/.venv", "/dist", "/build", "**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "debate_agent/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
exclude = ["src/debate_agent/ui/app.py"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
